; Example LinCTServices.ini for the CANoe 12 LIN Slave Conformance Tester.
; Copy over C:\ProgramData\Vector\CANoe\12.0 (x64)\LinCTServices.ini only after backing up the original;
; the file is global and applies to every CANoe configuration on the PC. Restore the backup after testing.
; All lengths and Dn/Rn values EXCLUDE the SID / RSID.
; Segments = ceil((length - 4) / 6) + 1. Segmented request needs >= 3 segments, segmented response >= 2.
; Replace every service below with one your node really supports (values here are placeholders).

[General]
; First byte (NAD) of the "neutral" master request, 0x80-0xFF. The node must ignore it.
Neutral_MasterRequest_NAD = 255

[_TP_Settings]
; 0 = ReadByIdentifier with a wrong Supplier ID / Function ID is not answered.
InvalidReadByIDAnswered = 0
; 0 = node keeps an ongoing diagnostic transfer when it receives a corrupted master request.
DiagRespLostOnDiagRequestError = 0
; Keep 0: when 1, PT-CT 82 compares the reply to [SegmentedRequest] with ResponseLen of [SegmentedResponse].
CheckSegmentedResponseLength = 0
CheckSegmentedResponseContent = 1

; Functional request (NAD 0x7E). The node processes it and does not answer.
; Placeholder: UDS ReadDataByIdentifier 22 F1 90.
[FunctionalRequest]
SID = 0x22
RequestLen=2
D1=0xF1
D2=0x90

; Segmented request, at least 3 segments: 1 + 12 bytes -> FF + 2 CF.
; Placeholder: UDS WriteDataByIdentifier 2E <DID> <10 data bytes>, written to RAM only.
[SegmentedRequest]
SID = 0x2E
RequestLen=12
D1=0x01
D2=0x00
D3=0x10
D4=0x11
D5=0x12
D6=0x13
D7=0x14
D8=0x15
D9=0x16
D10=0x17
D11=0x18
D12=0x19

; Segmented response, at least 2 segments. ResponseLen and R1..Rn exclude the RSID (0x62).
; Placeholder: 22 F1 90 answered with 62 F1 90 + 11 data bytes (13 bytes after the RSID).
[SegmentedResponse]
SID = 0x22
RequestLen=2
ResponseLen=13
D1=0xF1
D2=0x90
R1=0xF1
R2=0x90
R3=0x30
R4=0x31
R5=0x32
R6=0x33
R7=0x34
R8=0x35
R9=0x36
R10=0x37
R11=0x38
R12=0x39
R13=0x41
